<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    {% if marks >= 90%}
    <h1>Grade A</h1>
    {% elif marks >= 75 %}
    <h1>Grade B</h1>
    {% elif marks >= 50 %}
    <h1>Grade C</h1>
    {% else %}
    <h1>Fail</h1>
    {% endif %}

    
</body>
</html>
